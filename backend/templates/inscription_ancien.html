<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription — Marrakech Career Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('accueil') }}" class="navbar-brand">
            <span class="logo-badge">🚀</span>
            Marrakech Career Finder
        </a>
        <div class="navbar-links">
            <a href="{{ url_for('connexion') }}">Se connecter</a>
        </div>
    </nav>

    <div class="hero">
        <h1>Crée ton compte 🎓</h1>
        <p>Rejoins la plateforme et trouve ton stage idéal à Marrakech.</p>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p class="flash">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" class="auth-form">
        <input type="text" name="nom" placeholder="Nom complet" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="mot_de_passe" placeholder="Mot de passe" required>
        <button type="submit">S'inscrire</button>
    </form>
    <p style="text-align:center;">Déjà un compte ? <a href="{{ url_for('connexion') }}">Se connecter</a></p>
</body>
</html>
