<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Marrakech Career Finder{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="auth-page auth-split">

  <aside class="auth-photo">
    <img src="{{ url_for('static', filename='img/koutoubia.jpg') }}" alt="La Koutoubia, Marrakech">
    <div class="auth-photo-text">
      <h2>Trouve ton stage à Marrakech</h2>
      <p>Des entreprises réelles, classées selon ton CV.</p>
    </div>
  </aside>

  <div class="auth-side">
    <main class="auth-wrap">
      <a href="{{ url_for('accueil') }}" class="auth-brand">
        <span class="auth-logo"><i class="bi bi-rocket-takeoff"></i></span>
        Marrakech Career Finder
      </a>

      {% with messages = get_flashed_messages() %}
        {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
