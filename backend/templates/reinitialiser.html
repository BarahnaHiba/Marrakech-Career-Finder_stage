{% extends "base_auth.html" %}
{% block title %}Nouveau mot de passe — Marrakech Career Finder{% endblock %}

{% block content %}
  <form method="POST" class="form-card card auth-card">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1 class="auth-title">Nouveau mot de passe</h1>
    <p class="auth-sub">Choisis un mot de passe d'au moins 8 caractères.</p>

    <label class="form-label" for="mot_de_passe">Nouveau mot de passe</label>
    <input id="mot_de_passe" type="password" name="mot_de_passe" minlength="8" placeholder="Nouveau mot de passe" required>

    <label class="form-label" for="confirmation">Confirmer le mot de passe</label>
    <input id="confirmation" type="password" name="confirmation" minlength="8" placeholder="Confirmer le mot de passe" required>

    <button type="submit" class="btn auth-btn">Enregistrer</button>
  </form>

  <p class="auth-foot"><a href="{{ url_for('connexion') }}">Retour à la connexion</a></p>
{% endblock %}
